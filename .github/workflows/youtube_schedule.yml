name: YouTube Shorts / Reels (3 AM Unlisted -> 8 AM Policy Check & Public)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [reel_3am_upload, reel_8am_publish]
  schedule:
    # ALTERNATE DAYS (सोमवार, बुधवार, शुक्रवार):
    # 1. रात 3:00 AM IST = 21:30 UTC Previous Day (Render & Upload Unlisted)
    - cron: '30 21 * * 0,2,4'
    # 2. सुबह 8:00 AM IST = 02:30 UTC (Policy Check & Publish Public)
    - cron: '30 2 * * 1,3,5'

concurrency:
  group: youtube-shorts-upload
  cancel-in-progress: false

jobs:
  reel-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js for Firebase
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install System Dependencies (ffmpeg & Hindi Fonts)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-deva fonts-noto-core fonts-lohit-deva || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt edge-tts google-api-python-client google-auth-oauthlib google-auth

      - name: Check UTC Hour
        id: time_check
        run: |
          UTC_HOUR=$(date -u +%H)
          echo "utc_hour=$UTC_HOUR" >> $GITHUB_OUTPUT
          echo "Current UTC Hour: $UTC_HOUR"

      # --- 3:00 AM IST STEP: UPLOAD REEL AS UNLISTED ---
      - name: 3:00 AM IST - Upload Reel as Unlisted
        if: steps.time_check.outputs.utc_hour == '21' || github.event_name == 'workflow_dispatch'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          GOOGLE_TTS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_TTS_SERVICE_ACCOUNT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python -u youtube_uploader.py

      # --- 8:00 AM IST STEP: POLICY/STRIKE CHECK & PUBLISH PUBLIC ---
      - name: 8:00 AM IST - Policy/Strike Check & Publish Reel Public
        if: steps.time_check.outputs.utc_hour == '02' || github.event_name == 'workflow_dispatch'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u quarantine_publish_content.py reel

      - name: Commit Updated YouTube Queue to Git
        run: |
          git config user.name "Krishna Vibez YouTube Bot"
          git config user.email "bot@krishnavibez.in"
          git add website/ quotes.txt used_quotes.txt used_kinetic_images.txt used_kinetic_music.txt youtube_reels_urls.txt youtube_used_urls.txt youtube_quarantine_queue.json youtube_quarantine_audit.log daily_post_tracker.json || true
          git diff --staged --quiet || git commit -m "Auto-processed Reel schedule [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git push origin master && break || sleep 3
          done
