name: Auto Post YouTube Shorts (Krishna Vibez)

on:
  schedule:
    # 3 times daily (Times in UTC):
    # 02:30 UTC = 08:00 AM IST (Morning)
    # 08:30 UTC = 02:00 PM IST (Afternoon)
    # 14:30 UTC = 08:00 PM IST (Evening Peak)
    - cron: '30 2,8,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  push:
    paths:
      - 'TRIGGER_YOUTUBE_POST.txt'

concurrency:
  group: youtube-shorts-upload
  cancel-in-progress: false

jobs:
  upload-youtube-short:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permission to update youtube_reels_urls.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ffmpeg, Chromium & Hindi Fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg chromium-browser fonts-noto-extra fonts-noto-core fonts-deva

      - name: Install Python dependencies
        run: pip install -r requirements.txt edge-tts

      - name: Upload Reel to YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_TTS_SERVICE_ACCOUNT }}
        run: python -u youtube_uploader.py

      - name: Commit Updated YouTube Queue to Git
        run: |
          git config user.name "Krishna Vibez YouTube Bot"
          git config user.email "bot@krishnavibez.in"
          git add quotes.txt used_quotes.txt used_kinetic_images.txt used_kinetic_music.txt youtube_reels_urls.txt youtube_used_urls.txt youtube_quarantine_queue.json youtube_quarantine_audit.log || true
          git diff --staged --quiet || git commit -m "Auto-posted Kinetic YouTube Short and updated queue [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git push origin master && break || sleep 3
          done
