name: Daily Devotional Article Post to Facebook

on:
  workflow_dispatch: # Allows manual trigger from GitHub anytime
  schedule:
    # Runs daily at 08:30 AM IST (03:00 UTC) - Prime morning reading time
    - cron: '0 3 * * *'

concurrency:
  group: daily-fb-article-post
  cancel-in-progress: false

jobs:
  post-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Daily Article Poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1808917602588221' }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python -u share_daily_article_fb.py

      - name: Commit updated history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add shared_articles_history.json
          git commit -m "chore: record daily Facebook article post [skip ci]" || true
          git pull --rebase origin master || true
          git push origin master || true

