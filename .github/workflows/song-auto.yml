name: Auto Song Pipeline (Every Sunday 9 AM IST)

on:
  workflow_dispatch: # मैनुअल रन - कभी भी काम करेगा
  repository_dispatch:
    types: [process_song, upload_song, run_song_pipeline]
  schedule:
    # हर रविवार सुबह 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * 0'

concurrency:
  group: song-pipeline
  cancel-in-progress: false

jobs:
  song-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt google-api-python-client google-auth-oauthlib google-auth pillow

      - name: Process new songs from Songs/inbox/ (Add to YouTube queue)
        run: python -u song_full_pipeline.py process
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload next song to YouTube (Private)
        run: python -u song_full_pipeline.py upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit Updated Song Queues to Git
        run: |
          git config user.name "Krishna Vibez Song Bot"
          git config user.email "bot@krishnavibez.in"
          git add song_urls.txt song_urls_backup.txt song_used_urls.txt song_uploaded_tracker.txt song_tracks_registry.json song_daily_tracker.json song_thumbnails_tracker.txt || true
          git diff --staged --quiet || git commit -m "Auto song pipeline: processed & uploaded [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git push origin master && break || sleep 3
          done
