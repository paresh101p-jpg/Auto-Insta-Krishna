name: Daily Krishna AI Music Video (15-Min Meditation)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  repository_dispatch: # Allows external triggers from https://cron-job.org/
    types: [generate_music_video, daily_music_video]
  schedule:
    # 3 Times Daily (Times in UTC):
    # 01:30 UTC = 07:00 AM IST (Morning Meditation)
    # 07:30 UTC = 01:00 PM IST (Afternoon Peace)
    # 13:30 UTC = 07:00 PM IST (Evening Relaxation)
    - cron: '30 1,7,13 * * *'

concurrency:
  group: krishna-music-video-upload
  cancel-in-progress: false

jobs:
  generate-and-upload-music-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Hindi Devanagari Fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-extra fonts-noto-core fonts-deva

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt || true
          pip install google-genai pillow requests

      - name: Generate and Upload 15-Min Golden Theme Music Video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u auto_music_video_pipeline.py

      - name: Auto-Cleanup Old Temporary Music Video Media
        run: |
          # Deletes generated temporary slides, audio, and videos so repo stays clean
          rm -rf temp_* music_video_temp_* *.mp4 || true
          echo "Temporary media cleaned up successfully."

      - name: Commit Updated Music Queues
        run: |
          git config user.name "Krishna Vibez Music Bot"
          git add treblo_music_video_only_urls.txt treblo_music_urls.txt treblo_music_used_urls.txt treblo_music_cycle_tracker.txt used_music_titles.txt music_theme_tracker.json used_music_images_tracker.txt music_video_images || true
          git diff --staged --quiet || git commit -m "Auto-posted 15-min Music Video, updated music queues, and archived used images [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git push origin master && break || sleep 3
          done

