name: Krishna AI Music Video (1 PM Unlisted -> 7 PM Policy Check & Public)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [music_video_1pm_upload, music_video_7pm_publish]
  schedule:
    # ALTERNATE DAYS (मंगलवार, गुरुवार, शनिवार):
    # 1. दोपहर 1:00 PM IST = 07:30 UTC (Render & Upload Unlisted)
    - cron: '30 7 * * 2,4,6'
    # 2. शाम 7:00 PM IST = 13:30 UTC (Policy Check & Publish Public)
    - cron: '30 13 * * 2,4,6'

concurrency:
  group: krishna-music-video-upload
  cancel-in-progress: false

jobs:
  music-video-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Hindi Fonts)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-deva fonts-noto-core fonts-lohit-deva || true

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt || true
          pip install google-genai pillow requests google-api-python-client google-auth-oauthlib google-auth

      - name: Check UTC Hour
        id: time_check
        run: |
          UTC_HOUR=$(date -u +%H)
          echo "utc_hour=$UTC_HOUR" >> $GITHUB_OUTPUT
          echo "Current UTC Hour: $UTC_HOUR"

      # --- 1:00 PM IST STEP: RENDER & UPLOAD MUSIC VIDEO AS UNLISTED ---
      - name: 1:00 PM IST - Render & Upload 15-Min Music Video as Unlisted
        if: steps.time_check.outputs.utc_hour == '07' || github.event_name == 'workflow_dispatch'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRIVACY_STATUS: 'unlisted'
        run: |
          python -u auto_music_video_pipeline.py

      # --- 7:00 PM IST STEP: POLICY/STRIKE CHECK & PUBLISH PUBLIC ---
      - name: 7:00 PM IST - Policy/Strike Check & Publish Music Video Public
        if: steps.time_check.outputs.utc_hour == '13' || github.event_name == 'workflow_dispatch'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -u quarantine_publish_content.py music_video

      - name: Auto-Cleanup Old Temporary Music Video Media
        run: |
          rm -rf temp_* music_video_temp_* *.mp4 || true

      - name: Commit Updated Music Queues
        run: |
          git config user.name "paresh101p-jpg"
          git config user.email "paresh101p@gmail.com"
          git add . || true
          git diff --staged --quiet || git commit -m "Auto-processed Music Video schedule [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master -X theirs || true
            git push origin master && break || sleep 10
          done
