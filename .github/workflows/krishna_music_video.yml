name: Krishna AI Music Video (15-Min Meditation - Every 2 Days)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  repository_dispatch: # Allows external triggers from https://cron-job.org/
    types: [generate_music_video, daily_music_video]
  push:
    paths:
      - 'TRIGGER_MUSIC_VIDEO.txt'
  schedule:
    # EXACTLY 1 TIME EVERY 2 DAYS IN THE EVENING (ALTERNATE DAYS):
    # 12:30 UTC = 06:00 PM IST (Takes ~50 mins to render, uploads right at ~06:55 - 07:00 PM IST Peak)
    - cron: '30 12 */2 * *'

concurrency:
  group: krishna-music-video-upload
  cancel-in-progress: false

jobs:
  generate-and-upload-music-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Hindi Devanagari Fonts)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-deva fonts-noto-core fonts-lohit-deva || true

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt || true
          pip install google-genai pillow requests google-api-python-client google-auth-oauthlib google-auth

      - name: Generate and Upload 15-Min Golden Theme Music Video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u auto_music_video_pipeline.py

      - name: Auto-Publish Clean Videos (>24h Quarantine)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u auto_publish_entire_channel.py || true

      - name: Auto-Cleanup Old Temporary Music Video Media
        run: |
          # Deletes generated temporary slides, audio, and videos so repo stays clean
          rm -rf temp_* music_video_temp_* *.mp4 || true
          echo "Temporary media cleaned up successfully."

      - name: Commit Updated Music Queues
        run: |
          git config user.name "paresh101p-jpg"
          git config user.email "paresh101p@gmail.com"
          git add . || true
          git commit -m "Auto-posted 15-min Music Video and updated queues [skip ci]" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master -X theirs || true
            git push origin master && break || sleep 10
          done
