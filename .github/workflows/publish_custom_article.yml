name: Publish High-SEO Krishna Article with 4K Cloud Images

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'आर्टिकल का मुख्य विषय (Topic) या शीर्षक'
        required: true
        default: 'मार्गशीर्ष माह में भगवान श्रीकृष्ण की विशेष कृपा'
      category:
        description: 'श्रेणी (Category) - उदा. भक्ति योग, गीता सार, जीवन प्रबंधन'
        required: false
        default: 'भगवद्गीता सार एवं भक्ति योग'

concurrency:
  group: custom-article-publisher
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow google-genai

      - name: Run Cloud Article & 4K Image Engine
        env:
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_CATEGORY: ${{ github.event.inputs.category }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1808917602588221' }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python -u cloud_article_image_engine.py

      - name: Commit & Push New Article & Images to GitHub Master
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Krishna Vibez Cloud Engine"
          git add website/public/articles/ website/public/images/articles/ website/public/articles.html website/public/index.html website/public/articles-sitemap.xml website/public/rss.xml
          git commit -m "feat(article): publish 100% cloud-verified 4K images & article for: ${{ github.event.inputs.topic }} [skip ci]" || true
          git pull --rebase origin master || true
          git push origin master || true

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "$FIREBASE_TOKEN"
        working-directory: website
