name: Daily Trending Spiritual Article Publisher (7:00 AM IST)

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST (Indian Standard Time) Every Day
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: daily-trending-article-engine
  cancel-in-progress: false

jobs:
  publish-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Generate Trending Article & Post to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1808917602588221' }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          SKIP_FB_POST: "true"
        run: python -u daily_trending_article_engine.py

      - name: Commit & Push New Article, Sitemap & Feeds
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Krishna Vibez Article Publisher"
          git add website/public/articles/*.html website/public/articles.html website/public/articles-sitemap.xml website/public/rss.xml shared_articles_history.json
          git commit -m "feat(article): publish daily trending spiritual article & update feeds [skip ci]" || true
          git pull --rebase origin master || true
          git push origin master || true

      - name: Set up Node.js for Firebase
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "$FIREBASE_TOKEN"
        working-directory: website

      - name: Post Article Link to Facebook (after deploy, avoids 404 preview)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1808917602588221' }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python -u post_pending_article_fb.py

      - name: Commit Facebook Post History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Krishna Vibez Article Publisher"
          git add shared_articles_history.json pending_fb_post.json || true
          git commit -m "feat(article): record facebook post for daily article [skip ci]" || true
          git pull --rebase origin master || true
          git push origin master || true
